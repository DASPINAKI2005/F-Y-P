    <path d="M0 108h420l-12 160c-1 13-12 21-25 21H32c-17 0-29-10-31-27L0 108z" fill="#182844"/>
    <circle cx="95" cy="190" r="23" fill="none" stroke="#F4F7FF" stroke-width="10"/>
    <circle cx="160" cy="235" r="23" fill="none" stroke="#F4F7FF" stroke-width="10"/>
