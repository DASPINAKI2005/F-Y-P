<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">GitHub Repo Analyzer logo</title>
  <desc id="logoDesc">A repository graph with analysis nodes and the RepoAnalyzer wordmark.</desc>
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#3ddcff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="32" height="32" rx="8" fill="#0f172a" stroke="#334155"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 8V24M11 15H19" stroke="url(#g1)" stroke-width="2"/>
    <circle cx="11" cy="8" r="2.5" fill="#0f172a" stroke="#3ddcff" stroke-width="1.8"/>
    <circle cx="11" cy="24" r="2.5" fill="#0f172a" stroke="#6ee7b7" stroke-width="1.8"/>
    <circle cx="19" cy="15" r="2.5" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.8"/>
    <circle cx="24" cy="23" r="1.8" fill="#3ddcff"/>
  </g>
  <text x="44" y="18" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="-0.25">Repo</text>
  <text x="44" y="31" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="-0.25">Analyzer</text>
</svg>
