<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7CFF"/>
      <stop offset=".48" stop-color="#25D9FF"/>
      <stop offset="1" stop-color="#FFB52E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37E8FF"/>
      <stop offset="1" stop-color="#246BFF"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#344A70"/>
      <stop offset="1" stop-color="#111B31"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- subtle circular glow -->
  <circle cx="512" cy="512" r="430" fill="#081426" opacity=".9"/>
  <circle cx="512" cy="512" r="432" fill="none" stroke="url(#ring)" stroke-width="24"
          stroke-linecap="round" stroke-dasharray="720 105 220 110" transform="rotate(-18 512 512)" filter="url(#glow)"/>

  <!-- GitHub/octocat silhouette -->
  <circle cx="500" cy="430" r="210" fill="#F5F8FF"/>
  <path fill="#101A2C" d="M500 258c-104 0-188 84-188 188 0 83 54 153 129 178 9 2 13-4 13-9v-34c-52 11-63-25-63-25-8-22-21-28-21-28-17-12 1-12 1-12 19 1 29 20 29 20 17 29 45 21 56 16 2-13 7-21 12-26-42-5-86-21-86-93 0-21 7-38 20-51-2-5-9-26 2-53 0 0 16-5 52 19 15-4 31-6 47-6s32 2 47 6c36-24 52-19 52-19 11 27 4 48 2 53 13 13 20 30 20 51 0 72-44 88-86 93 7 6 13 18 13 36v53c0 5 3 11 13 9 75-25 129-95 129-178 0-104-84-188-188-188z"/>

