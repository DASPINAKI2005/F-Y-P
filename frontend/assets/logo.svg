    <rect x="30" y="42" width="170" height="13" rx="6" fill="#7185A8"/>
    <rect x="30" y="78" width="145" height="13" rx="6" fill="#7185A8"/>
    <rect x="30" y="114" width="168" height="15" rx="7" fill="#24BFFF"/>
    <rect x="30" y="153" width="95" height="13" rx="6" fill="#7185A8"/>
    <rect x="135" y="153" width="65" height="13" rx="6" fill="#A66BFF"/>
    <rect x="30" y="190" width="165" height="13" rx="6" fill="#7185A8"/>
